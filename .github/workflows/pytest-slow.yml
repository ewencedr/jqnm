name: Run pytest for slow tests

on: 
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# The slow test test_build_cache computes all 860 default modes from scratch
# (~10 CPU-hours), longer than the 6 h limit of GitHub-hosted runners; run it
# locally or on a cluster with `pytest -m slow`.
jobs:
  comparison-tests:
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install original qnm package first
      run: |
        python -m pip install --upgrade pip
        # Install original qnm first before local package
        pip install qnm
        python -c "import qnm; qnm.download_data()"

    - name: Install jqnm dependencies
      run: |
        pip install -r requirements.txt
        pip list

    - name: Install jqnm package
      run: |
        pip install .

    - name: Run comparison tests
      run: |
        pip install pytest
        pytest -vv test/test_comparison_qnm.py
